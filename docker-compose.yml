version: "3.8"

services:
  # 1. The FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - "C:/Users/tusharsharma.securit/.cache/huggingface:/root/.cache/huggingface"
    env_file:
      - .env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 2. The Streamlit Frontend
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    depends_on:
      - api
    env_file:
      - .env
    restart: unless-stopped

  # 3. Redis State Persistence
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped